name: Check and deploy Team Hub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-hub-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/suite-auth.test.mjs
      - name: Reject high and critical dependency advisories (including build tools)
        run: npm audit --audit-level=high
      - name: Verify design-decision concurrent transactions
        run: |
          PG_BIN="$(find /usr/lib/postgresql -path '*/bin/postgres' -type f -printf '%h\n' | sort -V | tail -1)"
          test -n "$PG_BIN" || { echo 'No installed PostgreSQL server binary found'; exit 1; }
          DESIGN_DECISION_PG_BIN="$PG_BIN" node tests/native/design-decision-concurrency.mjs
      - name: Verify Attendance concurrent transactions
        run: |
          PG_BIN="$(find /usr/lib/postgresql -path '*/bin/postgres' -type f -printf '%h\n' | sort -V | tail -1)"
          test -n "$PG_BIN" || { echo 'No installed PostgreSQL server binary found'; exit 1; }
          ATTENDANCE_EDITING_PG_BIN="$PG_BIN" node tests/native/attendance-editing-concurrency.mjs
      - name: Verify Attendance abuse and lock contention
        run: |
          PG_BIN="$(find /usr/lib/postgresql -path '*/bin/postgres' -type f -printf '%h\n' | sort -V | tail -1)"
          test -n "$PG_BIN" || { echo 'No installed PostgreSQL server binary found'; exit 1; }
          ATTENDANCE_ABUSE_PG_BIN="$PG_BIN" node tests/native/attendance-abuse-concurrency.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Retain synthetic account access previews
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: account-access-review
          path: test-results/account-access-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain privacy notice browser previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: privacy-notice-review
          path: test-results/privacy-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate synthetic Attendance preview
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: node scripts/preview-attendance-editing.mjs
      - name: Upload synthetic Attendance editing review
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-editing-review
          path: |
            test-results/attendance-edit-*.png
            test-results/attendance-required-roster-review-*.png
            test-results/attendance-how-to-*.png
            test-results/attendance-policy-*.png
            test-results/policy-dashboard-*.png
            test-results/attendance-preview.html
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic personal Attendance request review
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-self-requests-review
          path: test-results/attendance-self-requests-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain Attendance browser failure evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-browser-failures
          path: test-results/attendance-ui-*/**/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload synthetic invitation review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: invitation-review-screenshots
          path: test-results/invite-cleanup/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic season goal review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: season-goals-review-screenshots
          path: test-results/season-goals-review/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic outreach review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: outreach-review-screenshots
          path: test-results/outreach-review/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic sprint review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: sprint-review-screenshots
          path: test-results/sprint-review/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic fabrication review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: fabrication-review-screenshots
          path: test-results/fabrication/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic assembly review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: assembly-review-screenshots
          path: test-results/assembly/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic design-decision review screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-decision-review-screenshots
          path: test-results/design-decisions/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic design-decision failure evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-decision-test-failures
          path: test-results/design-decision-ui-*/**/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  fabrication-local-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: '2.119.0'
      - name: Check local-only integration guards
        run: node --test tests/integration/fabrication-safety.test.mjs
      - name: Verify disposable Supabase Auth, Edge, Storage, and PostgreSQL
        run: node tests/integration/fabrication-local.mjs --run
  attendance-security-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [attendance, shared-sites]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: '2.119.0'
      - name: Check local-only integration guards
        run: node --test tests/integration/fabrication-safety.test.mjs
      - name: Verify Attendance direct API security in disposable Auth and PostgREST
        if: matrix.scope == 'attendance'
        env:
          ATTENDANCE_SECURITY_INTEGRATION: '1'
        run: node tests/integration/fabrication-local.mjs --run
      - name: Verify shared Team Hub, Inventory, and Pit API boundaries
        if: matrix.scope == 'shared-sites'
        env:
          SHARED_SECURITY_INTEGRATION: '1'
        run: node tests/integration/fabrication-local.mjs --run
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, attendance-security-integration]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
