name: Check Hub themes (synthetic only)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - '*.html'
      - 'tests/theme*.spec.ts'
      - 'tests/hub-usability.spec.ts'
      - 'tests/events-privacy.spec.ts'
      - 'tests/privacy.spec.ts'
      - 'tests/assembly-model.spec.ts'
      - '.github/workflows/hub-theme-check.yml'
permissions:
  contents: read
jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/theme-preference.spec.ts tests/theme-ui.spec.ts tests/hub-usability.spec.ts tests/events-privacy.spec.ts tests/privacy.spec.ts tests/assembly-model.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-theme-synthetic-review
          path: test-results/
          retention-days: 7
