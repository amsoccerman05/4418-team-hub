[functions.team-invitations]
# The handler validates the caller with Auth /user before its manager-authorized RPC.
verify_jwt = false

[functions.fabrication-files]
# Auth.getUser verifies the token; scoped RPCs recheck the current active profile/project.
verify_jwt = false

[functions.team-meals]
# Public contributions are accountless; the handler verifies manager bearers with
# configured Auth /user and SQL rechecks active mentor/admin roles on every call.
# Runtime, real mail and dispatch each remain disabled until explicitly enabled.
verify_jwt = false
